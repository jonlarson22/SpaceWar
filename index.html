<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Space War</title>
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="Turn-based hex-grid space combat. A remake of the 2001 Palm OS classic.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Space War">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="statusbar">
    <span id="game-title">Space War</span>
    <span id="player-status"><span id="hud-shields">Shld: --</span> <span id="hud-speed">Spd: --</span></span>
  </header>
  <main id="board-wrap">
    <canvas id="board"></canvas>
    <div id="hex-info"></div>
  </main>
  <footer id="actionbar">
    <div id="atk-row">
      <button class="atk" data-atk="phasers">Phasers</button>
      <button class="atk" data-atk="torpedoes">Torpedos</button>
      <button class="atk active" data-atk="none">Hold</button>
      <button class="atk danger wrap" data-atk="selfdestruct">Self Destruct</button>
      <button id="end-turn" disabled>Commit Turn</button>
    </div>
    <div id="special-row" class="hidden">
      <button id="spec-transwarp">Transwarp</button>
      <button id="spec-regen">Regen +5</button>
    </div>
    <div id="hint-row"><span id="hint">Select destination</span><span id="auth-status">Connecting…</span></div>
  </footer>
</div>
<div id="setup-menu">
  <h1>SPACE WAR</h1>
  <p class="subtitle">New Game Setup</p>
  <div class="setup-section">
    <label class="text-label">Your Name<input id="setup-name" value="Jameson" maxlength="20"></label>
    <label class="text-label">Ship Name<input id="setup-shipname" value="U.S.S. Reliant" maxlength="24"></label>
  </div>
  <div class="setup-section">
    <div class="setup-label">Your Race</div>
    <div id="setup-races" class="btn-row"></div>
    <div id="race-desc" class="race-desc"></div>
  </div>
  <div class="setup-section">
    <div class="setup-label">AI Opponents</div>
    <div class="btn-row">
      <button id="ai-minus" class="mini">−</button>
      <span id="ai-count" class="count">1</span>
      <button id="ai-plus" class="mini">+</button>
    </div>
    <div id="ai-races"></div>
  </div>
  <div class="setup-section">
    <div class="setup-label">Sentry Guns <span class="dim">(dangerous — for experienced captains)</span></div>
    <div id="setup-sentries" class="btn-row"></div>
  </div>
  <div class="setup-section">
    <label class="check-label"><input type="checkbox" id="setup-teamplay"> Team Play <span class="dim">(ships of the same race are allies)</span></label>
  </div>
  <button id="launch">LAUNCH</button>
</div>
<div id="gameover" class="hidden">
  <div id="gameover-card">
    <h2 id="gameover-title">Victory!</h2>
    <p id="gameover-sub"></p>
    <button id="new-game">New Game</button>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
